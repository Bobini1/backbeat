name: Publish C API SDK

run-name: Publish C API SDK from ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  require-main:
    name: Require main
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow may only be run from main." >&2
            exit 1
          fi

  build:
    name: Build and test SDKs
    needs: require-main
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      capi_only: true

  release:
    name: Publish permanent release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download SDK packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backbeat-c-sdk-*
          path: dist
          merge-multiple: true

      - name: Download Java SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backbeat-java-sdk-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum ./*.zip ./*.jar > SHA256SUMS

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="c-sdk-${GITHUB_SHA}"
          release_title="Backbeat C API ${GITHUB_SHA::12}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "Manually published C API SDKs built from main at commit $GITHUB_SHA." \
              --prerelease
          fi
