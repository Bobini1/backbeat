[package]
name = "backbeat_vf_winfsp"
version = "0.1.0"
edition.workspace = true
authors = ["zkldi <zkldi@proton.me>"]
readme = "README.md"
license = "GPL-3.0"
repository = "https://github.com/zkldi/backbeat"

# Windows-only mount adapter. The whole crate is gated to `cfg(windows)` in
# `src/lib.rs`, and all non-`build-dependencies` are target-gated so the crate
# is an empty shell on non-Windows targets and never pulls in the `winfsp`
# binding (which only compiles on Windows).

[target.'cfg(windows)'.dependencies]
winfsp = "0.13"
backbeat_vf_fs = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.13"
